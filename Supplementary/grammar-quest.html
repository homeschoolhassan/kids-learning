<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#0B1221;--surface:#111827;--card:#1F2937;--card2:#263347;--border:#374151;--text:#F9FAFB;--text2:#D1D5DB;--muted:#9CA3AF;--gold:#FCD34D;--gold2:#F59E0B;--correct:#4ADE80;--correct-bg:rgba(74,222,128,0.12);--wrong:#F87171;--wrong-bg:rgba(248,113,113,0.12);--accent:#6366F1}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F4F6FB;--surface:#FFFFFF;--card:#FFFFFF;--card2:#EFF2F8;--border:#E5E7EB;--text:#111827;--text2:#374151;--muted:#6B7280;--correct-bg:rgba(34,197,94,0.1);--wrong-bg:rgba(239,68,68,0.1)}}
:root[data-theme="light"]{--bg:#F4F6FB;--surface:#FFFFFF;--card:#FFFFFF;--card2:#EFF2F8;--border:#E5E7EB;--text:#111827;--text2:#374151;--muted:#6B7280;--correct-bg:rgba(34,197,94,0.1);--wrong-bg:rgba(239,68,68,0.1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0;transition:background .3s,color .3s}
button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;outline:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;gap:.75rem;flex-wrap:wrap}
#logo{font-family:'Fredoka One',cursive;font-size:1.5rem;color:var(--gold);letter-spacing:.02em;white-space:nowrap}
#logo span{color:var(--text)}
.bar-right{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
#topic-select{font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;background:var(--card);color:var(--text);border:2px solid var(--border);border-radius:999px;padding:.35rem 1rem;cursor:pointer}
#topic-select:focus{border-color:var(--gold)}
.stat-pill{display:flex;align-items:center;gap:.3rem;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:.3rem .75rem;font-weight:700;font-size:.9rem}
.stat-pill .icon{font-size:1rem}
#streak-pill .icon{color:#F97316}
#stars-pill .icon{color:var(--gold)}
#theme-btn{background:var(--card);border:1.5px solid var(--border);border-radius:999px;width:2.2rem;height:2.2rem;font-size:1rem;display:flex;align-items:center;justify-content:center}
.screen{display:none;animation:fadeIn .25s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#home-screen{padding:1.5rem 1rem 3rem}
.home-header{text-align:center;margin-bottom:2rem}
.home-header h1{font-family:'Fredoka One',cursive;font-size:2rem;color:var(--gold);text-wrap:balance}
.home-header p{color:var(--muted);font-size:.95rem;margin-top:.3rem}
.mixed-banner{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:linear-gradient(135deg,#312E81,#1E3A5F);border:2px solid #6366F1;border-radius:16px;padding:1rem 1.25rem;margin-bottom:1.5rem;max-width:700px;margin-left:auto;margin-right:auto;flex-wrap:wrap}
.mixed-banner h2{font-size:1.05rem;color:#fff;font-weight:800}
.mixed-banner p{font-size:.82rem;color:#C7D2FE;margin-top:.2rem}
.btn-mixed{background:var(--gold);color:#1A1033;font-weight:800;font-size:.9rem;border-radius:10px;padding:.5rem 1.2rem;white-space:nowrap}
.topics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.85rem;max-width:700px;margin:0 auto}
.topic-card{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:1rem;cursor:pointer;transition:transform .15s,border-color .15s;text-align:center}
.topic-card:hover{transform:translateY(-2px);border-color:var(--accent-color)}
.topic-card .tc-emoji{font-size:2rem;display:block;margin-bottom:.4rem}
.topic-card .tc-name{font-weight:800;font-size:.95rem;color:var(--text)}
.topic-card .tc-sub{font-size:.75rem;color:var(--muted);margin-top:.2rem}
.topic-card .tc-prog{margin-top:.65rem;height:5px;background:var(--card2);border-radius:999px;overflow:hidden}
.topic-card .tc-fill{height:100%;border-radius:999px;transition:width .4s}
#learn-screen{padding:1rem 1rem 5rem}
.back-btn{display:inline-flex;align-items:center;gap:.3rem;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:.4rem .85rem;font-weight:700;font-size:.9rem;color:var(--text);margin-bottom:1rem}
.learn-hero{border-radius:16px;padding:1.25rem;margin-bottom:1rem;border:2px solid var(--accent-color,#888)}
.learn-hero h2{font-family:'Fredoka One',cursive;font-size:1.7rem;display:flex;align-items:center;gap:.4rem}
.learn-hero .lh-def{margin-top:.4rem;font-size:.95rem;color:var(--text2);line-height:1.5}
.learn-hero .lh-tip{margin-top:.75rem;font-size:.85rem;background:rgba(0,0,0,.2);border-radius:8px;padding:.5rem .75rem;color:var(--gold)}
.learn-section{margin-bottom:1rem}
.learn-section h3{font-size:.85rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.examples-row{display:flex;flex-wrap:wrap;gap:.5rem}
.ex-chip{background:var(--card2);border:1.5px solid var(--border);border-radius:10px;padding:.35rem .75rem;font-size:.88rem}
.ex-chip strong{color:var(--accent-color,var(--gold));font-weight:800}
.ex-chip span{color:var(--muted);font-size:.78rem;margin-left:.3rem}
.subcat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:.55rem}
.subcat-card{background:var(--card2);border:1.5px solid var(--border);border-radius:12px;padding:.65rem .75rem}
.subcat-card .sc-title{font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:.3rem;color:var(--text)}
.subcat-card .sc-desc{font-size:.76rem;color:var(--muted);margin-top:.2rem;line-height:1.4}
.diff-selector{margin:1rem 0;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:1rem}
.diff-label{font-weight:800;font-size:.9rem;margin-bottom:.5rem;color:var(--text)}
.diff-row{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.5rem}
.diff-btn{flex:1;min-width:65px;padding:.45rem .6rem;border-radius:10px;border:2px solid var(--border);background:var(--card2);font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;cursor:pointer;transition:all .15s;color:var(--text)}
.diff-btn.active{border-color:var(--accent-color,var(--gold));background:rgba(252,211,77,.15);color:var(--gold)}
.diff-desc{font-size:.8rem;color:var(--muted);line-height:1.4}
.btn-start-quiz{display:block;width:calc(100% - 2rem);max-width:680px;margin:0 auto;padding:.9rem;background:var(--accent-color,var(--gold));color:#1A1033;font-weight:800;font-size:1.1rem;border-radius:14px;position:fixed;bottom:1rem;left:50%;transform:translateX(-50%)}
#quiz-screen{padding:1rem 1rem 2rem}
.quiz-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.quiz-topic-badge{font-size:.82rem;font-weight:800;padding:.3rem .75rem;border-radius:999px;border:1.5px solid var(--accent-color,var(--border));color:var(--accent-color,var(--text))}
.quiz-score-display{font-size:1.1rem;font-weight:800;color:var(--gold)}
.progress-bar-wrap{margin-bottom:1rem}
.progress-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:.25rem}
.progress-track{height:8px;background:var(--card2);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent-color,var(--gold));border-radius:999px;transition:width .4s ease}
.q-card{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:1.25rem;margin-bottom:1rem}
.q-type-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.5rem}
.q-text{font-size:1.05rem;font-weight:700;line-height:1.45;margin-bottom:1rem}
.options-grid{display:grid;gap:.5rem}
.opt-btn{text-align:left;padding:.7rem 1rem;background:var(--card2);border:2px solid var(--border);border-radius:12px;font-size:.95rem;font-weight:700;color:var(--text);transition:all .15s;line-height:1.35}
.opt-btn:hover:not([disabled]){border-color:var(--accent-color,var(--gold))}
.opt-btn.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct)}
.opt-btn.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:.5rem}
.tf-btn{padding:.85rem;border-radius:14px;font-size:1.1rem;font-weight:800;border:2px solid var(--border);background:var(--card2);color:var(--text);transition:all .15s}
.tf-btn:hover:not([disabled]){border-color:var(--accent-color,var(--gold))}
.tf-btn.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct)}
.tf-btn.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.id-instruction{font-size:.85rem;color:var(--muted);margin-bottom:.5rem}
.id-words{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem}
.word-chip{padding:.4rem .75rem;background:var(--card2);border:2px solid var(--border);border-radius:10px;font-size:.95rem;font-weight:700;color:var(--text);transition:all .15s}
.word-chip.selected{border-color:var(--accent-color,var(--gold));background:rgba(252,211,77,.15);color:var(--gold)}
.word-chip.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}
.word-chip.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}
.word-chip.missed{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);box-shadow:0 0 0 2px var(--correct)}
.btn-check-id,.btn-check-type{display:block;width:100%;padding:.65rem;background:var(--accent-color,var(--gold));color:#1A1033;border-radius:12px;font-weight:800;font-size:.95rem;margin-top:.5rem}
.type-input-wrap{margin:.5rem 0}
.type-input{width:100%;padding:.75rem 1rem;font-size:1.15rem;font-family:'Nunito',sans-serif;font-weight:700;background:var(--card2);border:2px solid var(--border);border-radius:12px;color:var(--text);text-align:center;letter-spacing:.02em}
.type-input:focus{outline:none;border-color:var(--accent-color,var(--gold))}
.type-input:disabled{opacity:.7}
.q-hint{font-size:.82rem;color:var(--muted);text-align:center;margin:.25rem 0 .5rem}
.feedback-box{border-radius:14px;padding:1rem;font-size:.92rem;line-height:1.45;font-weight:600;display:none}
.feedback-box.correct{background:var(--correct-bg);border:2px solid var(--correct);color:var(--correct)}
.feedback-box.wrong{background:var(--wrong-bg);border:2px solid var(--wrong);color:var(--wrong)}
.feedback-box .fb-head{font-size:1.1rem;font-weight:800;margin-bottom:.35rem}
.btn-next{display:block;width:100%;padding:.85rem;background:var(--gold);color:#1A1033;border-radius:14px;font-weight:800;font-size:1.05rem;margin-top:.85rem}
#result-screen{padding:1.5rem 1rem 3rem}
.result-card{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:1.5rem;max-width:520px;margin:0 auto;text-align:center}
.result-emoji{font-size:3.5rem;margin-bottom:.5rem}
.result-title{font-family:'Fredoka One',cursive;font-size:1.8rem;color:var(--gold)}
.result-sub{font-size:.9rem;color:var(--muted);margin-top:.25rem}
.result-stars{font-size:1.5rem;font-weight:800;color:var(--gold);margin:.85rem 0}
.result-stats{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin:1rem 0}
.result-stat{background:var(--card2);border-radius:12px;padding:.75rem;font-size:.82rem;color:var(--muted)}
.result-stat strong{display:block;font-size:1.3rem;font-weight:800;color:var(--text)}
.badge-unlocked{background:rgba(252,211,77,.12);border:1.5px solid var(--gold);border-radius:12px;padding:.6rem .9rem;margin-top:.75rem;font-size:.88rem;font-weight:700;color:var(--gold)}
.btn-play-again,.btn-home-result{display:block;padding:.8rem;border-radius:12px;font-weight:800;font-size:.95rem;margin-top:.65rem;cursor:pointer}
.btn-play-again{background:var(--gold);color:#1A1033}
.btn-home-result{background:var(--card2);border:2px solid var(--border);color:var(--text)}
.badges-section{max-width:520px;margin:1rem auto 0}
.badges-section h3{font-size:.82rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.badges-grid{display:flex;flex-wrap:wrap;gap:.45rem}
.badge-pill{background:var(--card2);border:1.5px solid var(--border);border-radius:999px;padding:.3rem .8rem;font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:.3rem}
.badge-pill.earned{border-color:var(--gold);color:var(--gold);background:rgba(252,211,77,.1)}
@media(max-width:480px){#topbar{padding:.6rem .9rem}#logo{font-size:1.2rem}.topics-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.65rem}.result-stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="topbar">
  <div id="logo">Grammar<span>Quest</span> 🌟</div>
  <div class="bar-right">
    <select id="topic-select" onchange="onTopicSelectChange(this.value)" aria-label="Select topic"><option value="">All Topics</option></select>
    <div class="stat-pill" id="stars-pill"><span class="icon">⭐</span><span id="total-stars-display">0</span></div>
    <div class="stat-pill" id="streak-pill"><span class="icon">🔥</span><span id="streak-display">0</span></div>
    <button class="stat-pill" id="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
  </div>
</div>
<div class="screen" id="home-screen">
  <div class="home-header"><h1>🏆 Choose Your Challenge</h1><p>Pick a grammar world to explore, or try the mixed challenge!</p></div>
  <div class="mixed-banner"><div><h2>⚡ Mixed Challenge</h2><p>Questions from all grammar topics — the ultimate test!</p></div><button class="btn-mixed" onclick="startMixed()">Start ▶</button></div>
  <div class="topics-grid" id="topics-grid"></div>
</div>
<div class="screen" id="learn-screen">
  <button class="back-btn" onclick="showHome()">← Back</button>
  <div id="learn-content"></div>
  <button class="btn-start-quiz" id="start-quiz-btn" onclick="startQuizForCurrentTopic()">🎮 Start Quiz →</button>
</div>
<div class="screen" id="quiz-screen">
  <button class="back-btn" onclick="showHome()">← Home</button>
  <div class="quiz-meta">
    <div class="quiz-topic-badge" id="quiz-topic-badge"></div>
    <div class="quiz-score-display"><span>⭐</span><span id="quiz-stars-display">0</span></div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-label"><span id="prog-label">Question 1 of 15</span><span id="prog-pct">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="q-card" id="question-card"></div>
  <div class="feedback-box" id="feedback-box"></div>
  <button class="btn-next hidden" id="btn-next" onclick="nextQuestion()">Next Question →</button>
</div>
<div class="screen" id="result-screen"><div id="result-content"></div></div>
<script>
const TOPICS={
  nouns:{id:'nouns',name:'Nouns',emoji:'🦁',color:'#FF9F43',subtitle:'Person, Place, Animal, or Thing',definition:'A noun is a word that names a person, place, animal, thing, or idea.',examples:[{word:'dog',type:'common noun – animal'},{word:'London',type:'proper noun – specific place'},{word:'flock',type:'collective noun – group of birds'},{word:'freedom',type:'abstract noun – idea'}],subcategories:[{name:'Common Nouns',desc:'General names: dog, city, teacher, book',emoji:'📦'},{name:'Proper Nouns',desc:'Specific names, always capitalized: Sarah, London, Monday',emoji:'🌟'},{name:'Abstract Nouns',desc:'Things you cannot touch: love, freedom, bravery',emoji:'💭'},{name:'Collective Nouns',desc:'Names for groups: a flock of birds, a pack of wolves',emoji:'🐺'},{name:'Singular & Plural',desc:'One vs many: cat→cats, child→children, box→boxes',emoji:'📚'},{name:'Possessive Nouns',desc:'Show ownership: Sara\'s book, the dog\'s bone',emoji:'🔑'}],tip:'✨ Tip: If you can put "a" or "the" before a word, it is probably a noun!'},
  pronouns:{id:'pronouns',name:'Pronouns',emoji:'👤',color:'#A855F7',subtitle:'Words That Replace Nouns',definition:'A pronoun takes the place of a noun so we don\'t repeat the same word.',examples:[{word:'She',type:'personal pronoun – replaces a girl\'s name'},{word:'this',type:'demonstrative – points nearby'},{word:'who',type:'interrogative – asks a question'},{word:'himself',type:'reflexive – refers back to subject'}],subcategories:[{name:'Personal Pronouns',desc:'I, you, he, she, it, we, they',emoji:'👥'},{name:'Subject Pronouns',desc:'Come before the verb: I, you, he, she, it, we, they',emoji:'⬆️'},{name:'Object Pronouns',desc:'Come after verb or preposition: me, him, her, us, them',emoji:'⬇️'},{name:'Possessive Pronouns',desc:'Show ownership: mine, yours, his, hers, theirs',emoji:'🔒'},{name:'Demonstrative Pronouns',desc:'Point to things: this, that, these, those',emoji:'👉'},{name:'Interrogative Pronouns',desc:'Ask questions: who, what, which, whom, whose',emoji:'❓'}],tip:'✨ Tip: Subject pronouns come BEFORE the verb. Object pronouns come AFTER it.'},
  verbs:{id:'verbs',name:'Verbs',emoji:'⚡',color:'#3B82F6',subtitle:'Action Words & Being Words',definition:'A verb tells what someone does (action) or is (state of being).',examples:[{word:'runs',type:'action verb – what the dog does'},{word:'is',type:'state-of-being verb'},{word:'has eaten',type:'present perfect tense'},{word:'will go',type:'future tense'}],subcategories:[{name:'Action Verbs',desc:'Show what someone does: run, jump, eat, write, sing',emoji:'🏃'},{name:'State-of-Being Verbs',desc:'am, is, are, was, were, be, been, being',emoji:'🌿'},{name:'Helping Verbs',desc:'Work with main verbs: can, will, has, have, do, may',emoji:'🤝'},{name:'Verb Tenses',desc:'Past (ran), Present (runs), Future (will run)',emoji:'⏰'},{name:'Regular Verbs',desc:'Add -ed for past: walk→walked, jump→jumped',emoji:'✅'},{name:'Irregular Verbs',desc:'Change completely: go→went, run→ran, eat→ate',emoji:'🔀'}],tip:'✨ Tip: Every sentence MUST have a verb! Look for the action or being word.'},
  adjectives:{id:'adjectives',name:'Adjectives',emoji:'🎨',color:'#10B981',subtitle:'Words That Describe Nouns',definition:'An adjective describes or modifies a noun. It tells what kind, which one, or how many.',examples:[{word:'big',type:'size – a big dog'},{word:'beautiful',type:'quality – a beautiful sunset'},{word:'three',type:'quantity – three apples'},{word:'happiest',type:'superlative – most happy'}],subcategories:[{name:'Descriptive Adjectives',desc:'Describe qualities: tall, blue, noisy, soft',emoji:'✏️'},{name:'Comparative',desc:'Compare two: taller, bigger, more beautiful',emoji:'⚖️'},{name:'Superlative',desc:'Compare three or more: tallest, most beautiful',emoji:'🏆'},{name:'Demonstrative Adjectives',desc:'Point out nouns: this book, those shoes',emoji:'👆'},{name:'Articles',desc:'a, an (indefinite) and the (definite)',emoji:'📌'},{name:'Possessive Adjectives',desc:'my, your, his, her, its, our, their',emoji:'🔑'}],tip:'✨ Tip: Adjectives come BEFORE the noun (a happy child) or after "to be" (She is happy).'},
  adverbs:{id:'adverbs',name:'Adverbs',emoji:'🚀',color:'#F59E0B',subtitle:'Words That Modify Verbs, Adjectives & Adverbs',definition:'An adverb tells HOW, WHEN, WHERE, or HOW OFTEN something happens.',examples:[{word:'quickly',type:'manner – tells HOW'},{word:'here',type:'place – tells WHERE'},{word:'yesterday',type:'time – tells WHEN'},{word:'always',type:'frequency – HOW OFTEN'}],subcategories:[{name:'Adverbs of Manner',desc:'Tell how: quickly, slowly, loudly, carefully',emoji:'🎭'},{name:'Adverbs of Place',desc:'Tell where: here, there, inside, outside',emoji:'📍'},{name:'Adverbs of Time',desc:'Tell when: yesterday, now, soon, already',emoji:'📅'},{name:'Adverbs of Frequency',desc:'Tell how often: always, often, sometimes, never',emoji:'🔄'},{name:'Interrogative Adverbs',desc:'Ask: how, where, when, why',emoji:'❓'},{name:'Intensifiers',desc:'Strengthen words: very, quite, extremely',emoji:'📊'}],tip:'✨ Tip: Many adverbs end in -LY (quickly, happily) but not all: here, there, always.'},
  prepositions:{id:'prepositions',name:'Prepositions',emoji:'🗺️',color:'#EC4899',subtitle:'Location & Relationship Words',definition:'A preposition shows the relationship between a noun and another word in the sentence.',examples:[{word:'on',type:'The book is on the table'},{word:'in',type:'She lives in Canada'},{word:'at',type:'The meeting is at 3 PM'},{word:'for',type:'She waited for an hour'}],subcategories:[{name:'Place Prepositions',desc:'in, on, at, under, over, beside, between, behind',emoji:'📍'},{name:'Time Prepositions',desc:'at, on, in, before, after, since, for, during',emoji:'⏰'},{name:'Direction Prepositions',desc:'to, from, into, through, across, towards',emoji:'➡️'},{name:'Prepositional Phrases',desc:'Preposition + noun: on the table, in the morning',emoji:'🔗'}],tip:'✨ Tip: A preposition is almost always followed by a noun!'},

{t:'mc',d:1,q:'A sentence must have a...',o:['verb only','subject only','subject and a predicate','period only'],a:2,e:'A complete sentence needs BOTH a subject (who/what) AND a predicate (verb/what they do).'},
{t:'mc',d:1,q:'Which of these is a complete sentence?',o:['Running fast.','The dog runs.','Big and blue.','After school.'],a:1,e:'"The dog runs." — has a subject (The dog) and a predicate (runs).'},

{t:'mc',d:1,q:'In "She runs fast," what is the predicate?',o:['She','runs fast','runs','the'],a:1,e:'The predicate is "runs fast" — it tells what she does.'},

{t:'mc',d:1,q:'What is the PREDICATE of a sentence?',o:['who or what','a description','what the subject does or is','a joining word'],a:2,e:'The predicate tells what the subject does or is — it always contains a verb.'},

{t:'tf',d:1,q:'Every sentence must have a subject and a predicate.',a:true,e:'Yes! Subject = who/what. Predicate = what they do or are.'},

{t:'tf',d:1,q:'"She laughed." is a complete sentence.',a:true,e:'Yes! Subject = "She." Predicate = "laughed." Complete sentence!'},
{t:'tf',d:1,q:'"Jumping in puddles." is a complete sentence.',a:false,e:'No — there is no subject. WHO is jumping? This is a fragment.'},

{t:'id',d:1,q:'Tap the PREDICATE verb in this sentence:',s:'My sister sings every morning',answers:[2],e:'"Sings" is the predicate verb — it tells what she does.'},

{t:'id',d:2,q:'Tap the MAIN VERB in the predicate:',s:'She quickly ran to school',answers:[2],e:'"Ran" is the main verb. "Quickly" is an adverb describing how.'},
{t:'id',d:2,q:'Tap the complete SUBJECT of this sentence:',s:'The tired boy fell asleep quickly',answers:[0,1,2],e:'"The tired boy" is the complete subject — article + adjective + noun.'},
{t:'id',d:2,q:'Tap the complete SUBJECT of this sentence:',s:'The happy puppy wagged its tail',answers:[0,1,2],e:'"The happy puppy" is the complete subject.'},
{t:'id',d:2,q:'Tap the complete SUBJECT of this sentence:',s:'Run to the door now',answers:[0],e:'"Run" is the predicate. In commands, the subject "You" is implied and hidden.'},

{t:'id',d:3,q:'Tap the complete SUBJECT of this sentence:',s:'The old man slowly walked to the park',answers:[0,1,2],e:'"The old man" is the complete subject — article + adjective + noun.'},
{t:'id',d:3,q:'Tap the complete SUBJECT of this sentence:',s:'My best friend moved away last year',answers:[0,1,2],e:'"My best friend" is the complete subject.'},
{t:'id',d:3,q:'Tap the SUBJECT of the main clause:',s:'Although she was tired she kept going',answers:[4],e:'"She" (the second one) is the subject of the main clause. The first "she" is in the subordinate clause.'},
],
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let state = {
  totalStars: 0,
  streak: 0,
  lastPlayDate: null,
  earnedBadges: [],
  topicProgress: {},   // topicId → {completed:n, bestScore:n}
  diffLevel: '1',      // '1' easy, '2' medium, '3' hard, 'all' all
};

// ─── CURRENT QUIZ SESSION ────────────────────────────────────────────────────
let session = {
  topicId: null,
  questions: [],
  idx: 0,
  correct: 0,
  starsEarned: 0,
  answered: false,
  isMixed: false,
  selectedWords: new Set(),
  currentQ: null,
};

// ─── DIFFICULTY CONFIG ───────────────────────────────────────────────────────
const DIFF_CONFIG = {
  '1':  { label:'🟢 Easy',   desc:'Identify what part of speech a word is — perfect for beginners!' },
  '2':  { label:'🟡 Medium', desc:'Identify the subcategory — you already know the basics!' },
  '3':  { label:'🔴 Hard',   desc:'Complex grammar — prove your excellence!' },
  'all':{ label:'⭐ All',    desc:'Mix of Easy, Medium, and Hard questions.' },
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function $(id){ return document.getElementById(id); }
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function saveState(){
  try{ localStorage.setItem('gq_state', JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem('gq_state');
    if(raw){ const s = JSON.parse(raw); Object.assign(state, s); }
  }catch(e){}
}

function updateStreak(){
  const today = new Date().toDateString();
  if(state.lastPlayDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  state.streak = (state.lastPlayDate === yesterday) ? state.streak + 1 : 1;
  state.lastPlayDate = today;
  checkBadges();
  saveState();
}

function awardStars(n){
  state.totalStars += n;
  session.starsEarned += n;
  $('total-stars-display').textContent = state.totalStars;
  $('quiz-stars-display').textContent = session.starsEarned;
}

function checkBadges(){
  const earned = state.earnedBadges;
  const add = id => { if(!earned.includes(id)) earned.push(id); };
  const totalQ = Object.values(state.topicProgress).reduce((s,p)=>s+(p.completed||0),0);
  if(totalQ >= 10) add('first10');
  if(state.streak >= 3) add('streak3');
  if(state.streak >= 5) add('streak5');
  const topicsUsed = Object.keys(state.topicProgress).length;
  if(topicsUsed >= 5) add('explorer');
  if(topicsUsed >= 11) add('allstar');
  const tp = state.topicProgress;
  if((tp.nouns?.bestScore||0) >= 90) add('noun_master');
  if((tp.verbs?.bestScore||0) >= 90) add('verb_master');
  saveState();
}

function checkPerfect(pct){
  if(pct >= 100 && !state.earnedBadges.includes('perfect')) state.earnedBadges.push('perfect');
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}

function showHome(){
  document.documentElement.style.removeProperty('--accent-color');
  renderTopicsGrid();
  updateTopbar();
  $('topic-select').value = '';
  showScreen('home-screen');
}

function onTopicSelectChange(val){
  if(!val){ showHome(); return; }
  showLearn(val);
}

function updateTopbar(){
  $('total-stars-display').textContent = state.totalStars;
  $('streak-display').textContent = state.streak;
}

// ─── HOME SCREEN ─────────────────────────────────────────────────────────────
function renderTopicsGrid(){
  const grid = $('topics-grid');
  const sel = $('topic-select');
  if(sel.options.length <= 1){
    TOPIC_ORDER.forEach(id=>{
      const t = TOPICS[id];
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = t.emoji + ' ' + t.name;
      sel.appendChild(opt);
    });
  }
  grid.innerHTML = '';
  TOPIC_ORDER.forEach(id=>{
    const t = TOPICS[id];
    const prog = state.topicProgress[id] || {};
    const pct = prog.bestScore || 0;
    const card = document.createElement('div');
    card.className = 'topic-card';
    card.style.setProperty('--accent-color', t.color);
    card.innerHTML = `<span class="tc-emoji">${t.emoji}</span>
      <div class="tc-name">${t.name}</div>
      <div class="tc-sub">${t.subtitle}</div>
      <div class="tc-prog"><div class="tc-fill" style="width:${pct}%;background:${t.color}"></div></div>`;
    card.onclick = () => showLearn(id);
    grid.appendChild(card);
  });
}

// ─── LEARN SCREEN ────────────────────────────────────────────────────────────
function showLearn(topicId){
  const t = TOPICS[topicId];
  if(!t) return;
  session.topicId = topicId;
  document.documentElement.style.setProperty('--accent-color', t.color);
  $('topic-select').value = topicId;

  const exHtml = t.examples.map(ex=>
    `<div class="ex-chip"><strong>${ex.word}</strong><span>${ex.type}</span></div>`
  ).join('');

  const scHtml = t.subcategories.map(sc=>
    `<div class="subcat-card"><div class="sc-title">${sc.emoji} ${sc.name}</div><div class="sc-desc">${sc.desc}</div></div>`
  ).join('');

  const pool = QB[topicId] || [];
  const c1 = pool.filter(q=>q.d===1).length;
  const c2 = pool.filter(q=>q.d===2).length;
  const c3 = pool.filter(q=>q.d===3).length;

  $('learn-content').innerHTML = `
    <div class="learn-hero" style="background:linear-gradient(135deg,${t.color}22,${t.color}11);border-color:${t.color}">
      <h2>${t.emoji} ${t.name}</h2>
      <div class="lh-def">${t.definition}</div>
      ${t.tip ? `<div class="lh-tip">${t.tip}</div>` : ''}
    </div>
    <div class="learn-section">
      <h3>Examples</h3>
      <div class="examples-row">${exHtml}</div>
    </div>
    <div class="learn-section">
      <h3>Categories</h3>
      <div class="subcat-grid">${scHtml}</div>
    </div>
    <div class="diff-selector" id="diff-selector">
      <div class="diff-label">🎯 Choose Difficulty</div>
      <div class="diff-row">
        <button class="diff-btn${state.diffLevel==='1'?' active':''}" data-diff="1" onclick="selectDiff('1')">🟢 Easy</button>
        <button class="diff-btn${state.diffLevel==='2'?' active':''}" data-diff="2" onclick="selectDiff('2')">🟡 Medium</button>
        <button class="diff-btn${state.diffLevel==='3'?' active':''}" data-diff="3" onclick="selectDiff('3')">🔴 Hard</button>
        <button class="diff-btn${state.diffLevel==='all'?' active':''}" data-diff="all" onclick="selectDiff('all')">⭐ All</button>
      </div>
      <div class="diff-desc" id="diff-desc">${DIFF_CONFIG[state.diffLevel].desc}</div>
      <div class="diff-desc" style="margin-top:.35rem;font-size:.75rem;opacity:.7">
        Questions available: 🟢 ${c1} Easy · 🟡 ${c2} Medium · 🔴 ${c3} Hard
      </div>
    </div>`;

  showScreen('learn-screen');
}

// FIX: use data-diff attribute instead of fragile emoji text matching
function selectDiff(level){
  state.diffLevel = level;
  saveState();
  document.querySelectorAll('.diff-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.diff === level);
  });
  const descEl = $('diff-desc');
  if(descEl) descEl.textContent = DIFF_CONFIG[level].desc;
}

// ─── BUILD SESSION ────────────────────────────────────────────────────────────
function buildSession(topicId, isMixed){
  let pool = [];
  if(isMixed){
    TOPIC_ORDER.forEach(id => pool = pool.concat(QB[id] || []));
  } else {
    pool = QB[topicId] || [];
  }
  // Filter by difficulty unless mixed
  if(!isMixed && state.diffLevel !== 'all'){
    const lvl = parseInt(state.diffLevel, 10);
    const filtered = pool.filter(q => q.d === lvl);
    if(filtered.length >= 5) pool = filtered;
  }
  return shuffle(pool).slice(0, 15);
}

// ─── START QUIZ ───────────────────────────────────────────────────────────────
function startQuizForCurrentTopic(){
  const topicId = session.topicId;
  if(!topicId) return;
  startQuizSession(topicId, buildSession(topicId, false), false);
}

// FIX: separated so "Play Again" in mixed mode works correctly
function startMixed(){
  const qs = buildSession(null, true);
  startQuizSession(null, qs, true);
}

function startQuizSession(topicId, questions, isMixed){
  if(!questions || questions.length === 0){ alert('No questions found for this selection!'); return; }
  updateStreak();
  session = {
    topicId, questions, idx: 0,
    correct: 0, starsEarned: 0,
    answered: false, isMixed,
    selectedWords: new Set(), currentQ: null,
  };
  const t = topicId ? TOPICS[topicId] : null;
  $('quiz-topic-badge').textContent = t ? (t.emoji + ' ' + t.name) : '⚡ Mixed Challenge';
  document.documentElement.style.setProperty('--accent-color', t ? t.color : '#6366F1');
  $('quiz-stars-display').textContent = '0';
  showScreen('quiz-screen');
  renderQuestion();
}

// ─── RENDER QUESTION ──────────────────────────────────────────────────────────
function renderQuestion(){
  const q = session.questions[session.idx];
  if(!q){ showResult(); return; }
  session.currentQ = q;
  session.answered = false;
  session.selectedWords = new Set();

  const total = session.questions.length;
  const pct = Math.round((session.idx / total) * 100);
  $('prog-label').textContent = `Question ${session.idx + 1} of ${total}`;
  $('prog-pct').textContent = pct + '%';
  $('progress-fill').style.width = pct + '%';
  $('btn-next').classList.add('hidden');

  const fb = $('feedback-box');
  fb.className = 'feedback-box';
  fb.style.display = 'none';

  // Mixed mode: per-question accent colour
  if(session.isMixed){
    const tid = TOPIC_ORDER.find(id => QB[id] && QB[id].includes(q));
    if(tid) document.documentElement.style.setProperty('--accent-color', TOPICS[tid].color);
  }

  let typeLabel = '';
  let bodyHtml = '';

  if(q.t === 'mc'){
    typeLabel = '📋 Multiple Choice';
    bodyHtml = `<div class="options-grid">${q.o.map((opt,i)=>
      `<button class="opt-btn" id="opt-${i}" onclick="pickMC(${i})">${opt}</button>`
    ).join('')}</div>`;

  } else if(q.t === 'tf'){
    typeLabel = '✅ True or False';
    bodyHtml = `<div class="tf-row">
      <button class="tf-btn" id="tf-true" onclick="pickTF(true)">✅ True</button>
      <button class="tf-btn" id="tf-false" onclick="pickTF(false)">❌ False</button>
    </div>`;

  } else if(q.t === 'id'){
    // FIX: q.q is already shown in q-text above; bodyHtml shows only sentence chips + button
    typeLabel = '👆 Tap the Word';
    const words = q.s.split(' ');
    bodyHtml = `<div class="id-words">${words.map((w,i)=>
      `<button class="word-chip" id="wc-${i}" onclick="toggleWord(${i})">${w}</button>`
    ).join('')}</div>
    <button class="btn-check-id" id="btn-check-id" onclick="checkID()">Check Answer ✓</button>`;

  } else if(q.t === 'type'){
    typeLabel = '✏️ Type Your Answer';
    bodyHtml = `<div class="type-input-wrap">
      ${q.hint ? `<div class="q-hint">💡 Hint: ${q.hint}</div>` : ''}
      <input class="type-input" id="type-input" type="text" placeholder="Type your answer here…"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        onkeydown="if(event.key==='Enter'&&!session.answered)checkType()">
      <button class="btn-check-type" onclick="checkType()">Check Answer ✓</button>
    </div>`;
  }

  $('question-card').innerHTML = `
    <div class="q-type-label">${typeLabel}</div>
    <div class="q-text">${q.q}</div>
    ${bodyHtml}`;

  if(q.t === 'type'){
    setTimeout(()=>{ const inp=$('type-input'); if(inp) inp.focus(); }, 80);
  }
}

// ─── ANSWER HANDLERS ─────────────────────────────────────────────────────────
function pickMC(chosen){
  if(session.answered) return;
  session.answered = true;
  const q = session.currentQ;
  const isCorrect = chosen === q.a;
  q.o.forEach((_,i)=>{
    const btn = $('opt-' + i);
    if(!btn) return;
    btn.disabled = true;
    if(i === q.a) btn.classList.add('correct');
    else if(i === chosen) btn.classList.add('wrong');
  });
  revealFeedback(isCorrect, q.e);
}

// FIX: was calling classList.add('') which throws DOMException, stopping the next button from appearing
function pickTF(chosen){
  if(session.answered) return;
  session.answered = true;
  const q = session.currentQ;
  const isCorrect = chosen === q.a;
  const trueBtn = $('tf-true');
  const falseBtn = $('tf-false');
  trueBtn.disabled = true;
  falseBtn.disabled = true;
  // Mark the correct answer green
  if(q.a === true)  trueBtn.classList.add('correct');
  else              falseBtn.classList.add('correct');
  // Mark the wrong choice red (only if incorrect)
  if(!isCorrect){
    if(chosen === true) trueBtn.classList.add('wrong');
    else                falseBtn.classList.add('wrong');
  }
  revealFeedback(isCorrect, q.e);
}

function toggleWord(idx){
  if(session.answered) return;
  const chip = $('wc-' + idx);
  if(!chip) return;
  if(session.selectedWords.has(idx)){
    session.selectedWords.delete(idx);
    chip.classList.remove('selected');
  } else {
    session.selectedWords.add(idx);
    chip.classList.add('selected');
  }
}

function checkID(){
  if(session.answered) return;
  session.answered = true;
  const q = session.currentQ;
  const words = q.s.split(' ');
  const expected = new Set(q.answers);
  const selected = session.selectedWords;
  let allRight = true;
  words.forEach((_,i)=>{
    const chip = $('wc-'+i);
    if(!chip) return;
    chip.disabled = true;
    if(expected.has(i) && selected.has(i)){
      chip.classList.remove('selected');
      chip.classList.add('correct');
    } else if(!expected.has(i) && selected.has(i)){
      chip.classList.remove('selected');
      chip.classList.add('wrong');
      allRight = false;
    } else if(expected.has(i) && !selected.has(i)){
      chip.classList.add('missed');
      allRight = false;
    }
  });
  const checkBtn = $('btn-check-id');
  if(checkBtn) checkBtn.disabled = true;
  revealFeedback(allRight, q.e);
}

// FIX: preserve apostrophes so "don't", "can't" etc. match correctly
function normalizeAnswer(str){
  return str.trim().toLowerCase()
    .replace(/['']/g, "'")          // normalise smart quotes to plain apostrophe
    .replace(/[^a-z0-9'\s-]/g, '') // keep letters, digits, apostrophes, hyphens
    .replace(/\s+/g, ' ')
    .trim();
}

function checkType(){
  if(session.answered) return;
  const q = session.currentQ;
  const inp = $('type-input');
  if(!inp) return;
  const raw = normalizeAnswer(inp.value);
  const accepted = (q.answers || []).map(a => normalizeAnswer(a));
  const isCorrect = accepted.includes(raw);
  inp.disabled = true;
  const checkBtn = inp.parentNode ? inp.parentNode.querySelector('.btn-check-type') : null;
  if(checkBtn) checkBtn.disabled = true;
  inp.style.borderColor = isCorrect ? 'var(--correct)' : 'var(--wrong)';
  session.answered = true;
  revealFeedback(isCorrect, q.e);
}

// ─── FEEDBACK & NEXT ─────────────────────────────────────────────────────────
function revealFeedback(isCorrect, explanation){
  if(isCorrect){
    session.correct++;
    awardStars(10);
  }
  const fb = $('feedback-box');
  fb.className = 'feedback-box ' + (isCorrect ? 'correct' : 'wrong');
  fb.style.display = 'block';
  fb.innerHTML = `<div class="fb-head">${isCorrect ? '✅ Correct! +10 ⭐' : '❌ Not quite!'}</div>
    <div>${explanation || ''}</div>`;
  $('btn-next').classList.remove('hidden');
}

function nextQuestion(){
  session.idx++;
  if(session.idx >= session.questions.length) showResult();
  else renderQuestion();
}

// ─── RESULT SCREEN ───────────────────────────────────────────────────────────
function showResult(){
  const total = session.questions.length;
  const correct = session.correct;
  const pct = total > 0 ? Math.round((correct/total)*100) : 0;

  if(session.topicId){
    const tp = state.topicProgress[session.topicId] || { completed:0, bestScore:0 };
    tp.completed += total;
    tp.bestScore = Math.max(tp.bestScore, pct);
    state.topicProgress[session.topicId] = tp;
    checkPerfect(pct);
  }
  checkBadges();
  saveState();

  const emoji  = pct===100?'🏆':pct>=80?'🌟':pct>=60?'😊':pct>=40?'💪':'🌱';
  const title  = pct===100?'Perfect Score!':pct>=80?'Excellent!':pct>=60?'Great Job!':pct>=40?'Good Effort!':'Keep Practising!';
  const sub    = pct===100?'You nailed every question!':pct>=80?'Almost perfect — amazing work!':pct>=60?'You are learning fast!':pct>=40?'Every attempt makes you stronger!':'Every expert started as a beginner!';

  const badgeHtml = state.earnedBadges.length
    ? `<div class="badge-unlocked">🎉 Badges: ${state.earnedBadges.map(id=>{
        const b = BADGE_DEFS.find(bd=>bd.id===id); return b ? b.emoji+' '+b.name : '';
      }).filter(Boolean).join(' · ')}</div>` : '';

  // FIX: Play Again button calls the correct function for mixed vs topic mode
  const isMixed = session.isMixed;
  const playAgainFn = isMixed ? 'startMixed()' : 'startQuizForCurrentTopic()';

  $('result-content').innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${title}</div>
      <div class="result-sub">${sub}</div>
      <div class="result-stars">⭐ ${session.starsEarned} stars earned this quiz!</div>
      <div class="result-stats">
        <div class="result-stat"><strong>${correct}/${total}</strong>Correct</div>
        <div class="result-stat"><strong>${pct}%</strong>Score</div>
        <div class="result-stat"><strong>${state.totalStars}</strong>Total Stars</div>
        <div class="result-stat"><strong>${state.streak}🔥</strong>Streak</div>
      </div>
      ${badgeHtml}
      <button class="btn-play-again" onclick="${playAgainFn}">🔄 Play Again</button>
      <button class="btn-home-result" onclick="showHome()">🏠 Choose Topic</button>
    </div>
    <div class="badges-section">
      <h3>All Badges</h3>
      <div class="badges-grid">${BADGE_DEFS.map(b=>{
        const earned = state.earnedBadges.includes(b.id);
        return `<div class="badge-pill ${earned?'earned':''}"><span>${b.emoji}</span><span>${b.name}</span></div>`;
      }).join('')}</div>
    </div>`;
  showScreen('result-screen');
}

// ─── THEME ────────────────────────────────────────────────────────────────────
// FIX: simplified — just toggle between dark and light with no double-detection
function toggleTheme(){
  const root = document.documentElement;
  const nowDark = root.getAttribute('data-theme') !== 'light';
  root.setAttribute('data-theme', nowDark ? 'light' : 'dark');
  $('theme-btn').textContent = nowDark ? '🌙' : '☀️';
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init(){
  loadState();
  updateTopbar();
  renderTopicsGrid();
  showScreen('home-screen');
  // Set theme button icon based on OS preference
  const prefersDark = matchMedia('(prefers-color-scheme:dark)').matches;
  $('theme-btn').textContent = prefersDark ? '☀️' : '🌙';
}

init();
</script>
