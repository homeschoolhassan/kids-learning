<!DOCTYPE html>
<title>Kids Learning Portal</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap">

<style>
/* =====================================================================
   DESIGN TOKENS
   ===================================================================== */
:root {
  --bg: #f2f6fb;
  --surface: #ffffff;
  --fg: #0f1f38;
  --fg2: #5a6e88;
  --fg3: #97aabf;
  --border: #dce6f0;
  --hero-bg: #0b3d5e;
  --hero-fg: #ffffff;
  --hero-sub: #a8cce0;
  --pill-radius: 5px;
  --card-radius: 10px;
  --f-display: 'Fredoka', 'Nunito', sans-serif;
  --f-body: 'Nunito', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1724; --surface: #162032; --fg: #e2ecf5;
    --fg2: #8ba3bc; --fg3: #4a6278; --border: #1e3047;
    --hero-bg: #071524; --hero-sub: #5a8aab;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1724; --surface: #162032; --fg: #e2ecf5;
  --fg2: #8ba3bc; --fg3: #4a6278; --border: #1e3047;
  --hero-bg: #071524; --hero-sub: #5a8aab;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }
body { font-family: var(--f-body); background: var(--bg); color: var(--fg); line-height: 1.5; }

/* =====================================================================
   HERO
   ===================================================================== */
.hero {
  background: var(--hero-bg);
  padding: 36px 24px 40px;
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px; flex-wrap: wrap;
}
.hero-eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--hero-sub); margin-bottom: 6px;
}
.hero h1 {
  font-family: var(--f-display);
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 700; color: var(--hero-fg);
  line-height: 1.1; letter-spacing: -.01em;
}
.hero h1 span { color: #5dcfff; }
.hero-meta { font-size: 14px; color: var(--hero-sub); margin-top: 10px; }

/* =====================================================================
   BREADCRUMB
   ===================================================================== */
.breadcrumb {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  font-size: 13px; background: var(--surface);
  max-width: 100%;
}
.breadcrumb a, .breadcrumb button.bc-btn {
  color: var(--fg2); text-decoration: none; background: none;
  border: none; font: inherit; cursor: pointer; padding: 0;
  transition: color .15s;
}
.breadcrumb a:hover, .breadcrumb button.bc-btn:hover { color: var(--fg); }
.breadcrumb .bc-sep { color: var(--fg3); user-select: none; }
.breadcrumb .bc-current { color: var(--fg); font-weight: 600; }

/* =====================================================================
   MAIN CONTENT AREA
   ===================================================================== */
.view { padding: 36px 24px; max-width: 1080px; margin: 0 auto; }
.view-title {
  font-family: var(--f-display); font-size: 26px; font-weight: 700;
  margin-bottom: 6px; display: flex; align-items: center; gap: 10px;
}
.view-desc { font-size: 14px; color: var(--fg2); margin-bottom: 32px; }

/* section divider inside a view */
.group-header {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--fg3); margin-bottom: 12px;
  margin-top: 28px; display: flex; align-items: center; gap: 8px;
}
.group-header:first-of-type { margin-top: 0; }
.group-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* =====================================================================
   CARD GRID
   ===================================================================== */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}

/* Category cards on home screen — wider + coloured left bar */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--card-radius);
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 8px;
  position: relative; overflow: hidden;
  transition: box-shadow .15s, transform .15s;
  text-decoration: none; color: inherit;
  cursor: pointer;
}
.card::before {
  content: ''; position: absolute; inset: 0 auto 0 0;
  width: 4px; background: var(--card-color, #ccc);
  border-radius: var(--card-radius) 0 0 var(--card-radius);
}
.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); transform: translateY(-2px); }
.card.soon { opacity: .6; cursor: default; border-style: dashed; }
.card.soon::before { opacity: .4; }
.card.soon:hover { box-shadow: none; transform: none; }

/* Category card extras */
.card-cat {
  padding: 20px 22px;
}
.card-cat-icon { font-size: 32px; line-height: 1; margin-bottom: 4px; }
.card-cat-name { font-family: var(--f-display); font-size: 19px; font-weight: 700; }
.card-cat-desc { font-size: 12px; color: var(--fg2); flex: 1; }
.card-cat-badge {
  font-size: 11px; font-weight: 700; padding: 2px 8px;
  border-radius: var(--pill-radius); margin-top: 4px;
  display: inline-block; width: fit-content;
}
.badge-active { background: #dcfce7; color: #15803d; }
.badge-soon { background: var(--bg); color: var(--fg3); border: 1px solid var(--border); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .badge-active { background: #052e16; color: #4ade80; }
}
:root[data-theme="dark"] .badge-active { background: #052e16; color: #4ade80; }

/* Subject card parts */
.card-icon { font-size: 24px; line-height: 1; }
.card-subject { font-family: var(--f-display); font-size: 16px; font-weight: 600; line-height: 1.2; }
.card-desc { font-size: 12px; color: var(--fg2); line-height: 1.5; flex: 1; }
.card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }

/* Grade / unit card parts */
.card-unit-label { font-family: var(--f-display); font-size: 16px; font-weight: 600; }
.card-unit-sub { font-size: 12px; color: var(--fg2); flex: 1; }
.card-unit-arrow { color: var(--fg3); font-size: 16px; margin-left: auto; }

/* Pills */
.pill { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: var(--pill-radius); }
.pill-ready { background: #dcfce7; color: #15803d; }
.pill-soon  { background: var(--bg); color: var(--fg3); border: 1px solid var(--border); }
.pill-wip   { background: #fef9c3; color: #854d0e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pill-ready { background: #052e16; color: #4ade80; }
  :root:not([data-theme="light"]) .pill-wip   { background: #1c1507; color: #fbbf24; }
}
:root[data-theme="dark"] .pill-ready { background: #052e16; color: #4ade80; }
:root[data-theme="dark"] .pill-wip   { background: #1c1507; color: #fbbf24; }

/* Empty state */
.empty-state {
  text-align: center; padding: 60px 24px; color: var(--fg3);
}
.empty-state .es-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }
.empty-state small { font-size: 13px; color: var(--fg3); margin-top: 6px; display: block; }

/* Footer */
footer {
  padding: 24px; border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; max-width: 1080px; margin: 0 auto;
}
footer p { font-size: 12px; color: var(--fg3); }
.theme-toggle {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--fg2); border-radius: 6px; padding: 5px 12px;
  font-size: 12px; font-family: var(--f-body); cursor: pointer;
}
.theme-toggle:hover { background: var(--bg); }

@media (max-width: 500px) {
  .hero { padding: 24px 16px 28px; }
  .cat-grid { grid-template-columns: 1fr 1fr; }
  .card-grid { grid-template-columns: 1fr 1fr; }
}

/* =================================================================
   NAVIGATION ENGINE  (no URL changes needed — simple stack-based)
   ================================================================= */
// navStack: array of breadcrumb levels
// Each level: { label, action } where action() re-renders that level
let navStack = [];

function goHome() {
  navStack = [];
  renderHome();
}

function goCategory(cat) {
  navStack = [
    { label: 'Home', action: goHome },
    { label: cat.name, action: () => goCategory(cat) },
  ];
  renderCategory(cat);
}

function goUnit(cat, group, unit) {
  navStack = [
    { label: 'Home', action: goHome },
    { label: cat.name, action: () => goCategory(cat) },
    { label: group.name, action: () => goCategory(cat) }, // back to category, scroll to group
    { label: unit.name, action: () => goUnit(cat, group, unit) },
  ];
  renderUnit(cat, group, unit);
}

/* =================================================================
   BREADCRUMB
   ================================================================= */
function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (navStack.length === 0) { bc.innerHTML = '<span class="bc-current">Home</span>'; return; }

  let html = '<button class="bc-btn" onclick="goHome()">Home</button>';
  navStack.forEach((item, i) => {
    html += '<span class="bc-sep">›</span>';
    if (i === navStack.length - 1) {
      html += `<span class="bc-current">${item.label}</span>`;
    } else {
      html += `<button class="bc-btn" onclick="navStack[${i}].action()">${item.label}</button>`;
    }
  });
  bc.innerHTML = html;
}

/* =================================================================
   RENDER: HOME — all categories
   ================================================================= */
function renderHome() {
  updateBreadcrumb();
  const main = document.getElementById('main-view');

  const totalReady = SITE.reduce((sum, cat) =>
    sum + cat.groups.reduce((s2, g) =>
      s2 + g.units.reduce((s3, u) =>
        s3 + (u.items || []).filter(it => it.status === 'ready').length, 0), 0), 0);

  let html = `<div class="view">
    <div class="view-title">📂 All Categories</div>
    <div class="view-desc">${SITE.length} categories · ${totalReady} guides ready</div>
    <div class="cat-grid">`;

  SITE.forEach(cat => {
    const readyCount = cat.groups.reduce((s, g) =>
      s + g.units.reduce((s2, u) =>
        s2 + (u.items || []).filter(it => it.status === 'ready').length, 0), 0);

    const badgeClass = readyCount > 0 ? 'badge-active' : 'badge-soon';
    const badgeText  = readyCount > 0 ? `${readyCount} ready` : 'Coming soon';

    html += `
      <div class="card card-cat" style="--card-color:${cat.color}" onclick="goCategory(SITE[${SITE.indexOf(cat)}])">
        <div class="card-cat-icon">${cat.icon}</div>
        <div class="card-cat-name">${cat.name}</div>
        <div class="card-cat-desc">${cat.desc}</div>
        <span class="card-cat-badge ${badgeClass}">${badgeText}</span>
      </div>`;
  });

  html += `</div></div>`;
  main.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =================================================================
   RENDER: CATEGORY — list of groups + their unit cards
   ================================================================= */
function renderCategory(cat) {
  updateBreadcrumb();
  const main = document.getElementById('main-view');
  let html = `<div class="view">
    <div class="view-title">${cat.icon} ${cat.name}</div>
    <div class="view-desc">${cat.desc}</div>`;

  if (cat.groups.length === 0) {
    html += emptyState('No content yet', 'Ask Claude to build the first guide for this category.');
  } else {
    cat.groups.forEach(group => {
      html += `<div class="group-header">${group.name}</div>`;

      if (group.units.length === 0) {
        html += `<p style="font-size:13px;color:var(--fg3);margin-bottom:16px;">Coming soon</p>`;
      } else {
        html += `<div class="card-grid">`;
        group.units.forEach(unit => {
          const readyCount = (unit.items || []).filter(it => it.status === 'ready').length;
          const totalItems = (unit.items || []).length;
          const hasItems   = totalItems > 0;
          const pillClass  = readyCount > 0 ? 'pill-ready' : 'pill-soon';
          const pillText   = readyCount > 0 ? `${readyCount} / ${totalItems} ready` : 'Coming soon';
          const clickable  = hasItems;

          if (clickable) {
            const catIdx   = SITE.indexOf(cat);
            const groupIdx = cat.groups.indexOf(group);
            const unitIdx  = group.units.indexOf(unit);
            html += `
              <div class="card" style="--card-color:${cat.color}"
                   onclick="goUnit(SITE[${catIdx}], SITE[${catIdx}].groups[${groupIdx}], SITE[${catIdx}].groups[${groupIdx}].units[${unitIdx}])">
                <div class="card-unit-label">${unit.name}</div>
                <div class="card-unit-sub">${unit.desc || ''}</div>
                <div class="card-footer">
                  <span class="pill ${pillClass}">${pillText}</span>
                  <span class="card-unit-arrow">›</span>
                </div>
              </div>`;
          } else {
            html += `
              <div class="card soon" style="--card-color:${cat.color}">
                <div class="card-unit-label">${unit.name}</div>
                <div class="card-unit-sub">${unit.desc || ''}</div>
                <div class="card-footer">
                  <span class="pill ${pillClass}">${pillText}</span>
                </div>
              </div>`;
          }
        });
        html += `</div>`;
      }
    });
  }

  html += `</div>`;
  main.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =================================================================
   RENDER: UNIT — subject / item cards
   ================================================================= */
function renderUnit(cat, group, unit) {
  updateBreadcrumb();
  const main = document.getElementById('main-view');
  let html = `<div class="view">
    <div class="view-title">${cat.icon} ${unit.name}</div>
    <div class="view-desc">${cat.name} · ${group.name}</div>`;

  const items = unit.items || [];
  if (items.length === 0) {
    html += emptyState('No guides yet', 'Ask Claude to build the first guide for this section.');
  } else {
    html += `<div class="card-grid">`;
    items.forEach(item => {
      const filePath = unit.path ? `${unit.path}/${item.file}` : item.file;
      if (item.status === 'ready' && item.file) {
        html += `
          <a class="card" href="${filePath}" style="--card-color:${item.color || cat.color}">
            <div class="card-icon">${item.icon || '📄'}</div>
            <div class="card-subject">${item.name}</div>
            <div class="card-desc">${item.desc || ''}</div>
            <div class="card-footer"><span class="pill pill-ready">✓ Ready</span></div>
          </a>`;
      } else if (item.status === 'wip') {
        html += `
          <div class="card soon" style="--card-color:${item.color || cat.color}">
            <div class="card-icon">${item.icon || '📄'}</div>
            <div class="card-subject">${item.name}</div>
            <div class="card-desc">${item.desc || ''}</div>
            <div class="card-footer"><span class="pill pill-wip">🔨 In progress</span></div>
          </div>`;
      } else {
        html += `
          <div class="card soon" style="--card-color:${item.color || cat.color}">
            <div class="card-icon">${item.icon || '📄'}</div>
            <div class="card-subject">${item.name}</div>
            <div class="card-desc">${item.desc || ''}</div>
            <div class="card-footer"><span class="pill pill-soon">Coming soon</span></div>
          </div>`;
      }
    });
    html += `</div>`;
  }

  html += `</div>`;
  main.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =================================================================
   HELPER: empty state block
   ================================================================= */
function emptyState(title, hint) {
  return `<div class="empty-state">
    <div class="es-icon">🚧</div>
    <p><strong>${title}</strong></p>
    <small>${hint}</small>
  </div>`;
}

/* =================================================================
   THEME TOGGLE
   ================================================================= */
function toggleTheme() {
  const r = document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  try { localStorage.setItem('portal-theme', r.getAttribute('data-theme')); } catch(e){}
}
try {
  const t = localStorage.getItem('portal-theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch(e){}

/* =================================================================
   BOOT
   ================================================================= */
goHome();
</script>
